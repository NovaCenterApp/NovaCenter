@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&family=Exo+2:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{background:#020810;color:#b8d8f8;font-family:'Exo 2',sans-serif;overflow-x:hidden;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.4) sepia(1) saturate(2) hue-rotate(165deg);}
:root{
  --bg:#020810;--surf:#080f20;--card:#0c1830;--card2:#101e38;
  --b1:#162840;--b2:#1e3858;
  --cy:#00d4ff;--cyd:rgba(0,212,255,.12);--cyg:0 0 22px rgba(0,212,255,.35);
  --gold:#c9a84c;--goldd:rgba(201,168,76,.15);
  --pos:#00e696;--neg:#ff3d6b;--warn:#ffb020;
  --txt:#b8d8f8;--dim:#3a6080;
  --ui:'Orbitron',monospace;--mono:'JetBrains Mono',monospace;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,212,255,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,212,255,.04) 1px,transparent 1px);background-size:48px 48px;}
.app::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,212,255,.012) 3px,rgba(0,212,255,.012) 4px);}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;
  justify-content:center;background:#050810;transition:opacity .6s ease;}
.splash.out{opacity:0;pointer-events:none;}
.splash img{width:100%;max-width:430px;height:100vh;object-fit:cover;object-position:center top;}

/* SIDEBAR */
.ov{position:fixed;inset:0;background:rgba(2,8,16,.82);backdrop-filter:blur(4px);z-index:300;}
.sb{position:fixed;top:0;left:0;bottom:0;width:272px;background:var(--card2);border-right:1px solid var(--b1);z-index:301;display:flex;flex-direction:column;}
.sb-hd{display:flex;flex-direction:column;align-items:center;padding:calc(20px + var(--sat)) 16px 14px;border-bottom:1px solid var(--b1);background:linear-gradient(180deg,rgba(201,168,76,.08),transparent);}
.sb-logo-img{width:72px;height:72px;object-fit:cover;object-position:50% 32%;border-radius:50%;border:1px solid rgba(201,168,76,.3);margin-bottom:8px;}
.sb-logo{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--gold);letter-spacing:3px;}
.sb-sub{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--dim);margin-top:2px;}
.sb-body{flex:1;overflow-y:auto;padding:10px 8px;}
.sb-sec{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;padding:6px 8px 4px;}
.sb-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:.2s;margin-bottom:2px;border:1px solid transparent;}
.sb-row:hover{background:var(--surf);}
.sb-row.on{background:var(--cyd);border-color:rgba(0,212,255,.18);}
.sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sb-nm{font-family:'Exo 2',sans-serif;font-size:13px;color:var(--txt);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-row.on .sb-nm{color:var(--cy);}
.sb-tipo{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--dim);flex-shrink:0;}
.sb-x{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sb-x:hover{color:var(--neg);}
.sb-ft{padding:12px;border-top:1px solid var(--b1);}
.sb-add{width:100%;padding:10px;border:1px dashed var(--b2);border-radius:10px;background:transparent;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:1px;cursor:pointer;transition:.2s;}
.sb-add:hover{border-color:var(--cy);color:var(--cy);}

/* HEADER \u2014 safe area aware */
.hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(2,8,16,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  padding-top:var(--sat);
  height:calc(56px + var(--sat));
}
.hbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--b1);background:var(--surf);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;flex-shrink:0;}
.hbtn:hover,.hbtn.on{border-color:var(--cy);color:var(--cy);background:var(--cyd);}
.hdr-logo-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.hdr-icon{width:32px;height:32px;object-fit:cover;object-position:50% 32%;border-radius:50%;border:1px solid rgba(201,168,76,.35);}
.hc{min-width:0;}
.hlogo{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.hlist{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:1px;}
.hdot{width:6px;height:6px;border-radius:50%;}

/* PAGE */
.pg{padding:14px 14px 90px;position:relative;z-index:1;}

/* MONTH SEL */
.msel{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--card);border:1px solid var(--b1);border-radius:12px;padding:10px 14px;}
.mbtn{width:28px;height:28px;border:1px solid var(--b1);border-radius:6px;background:var(--surf);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s;flex-shrink:0;}
.mbtn:hover{border-color:var(--cy);color:var(--cy);}
.mnm{flex:1;text-align:center;font-family:var(--ui);font-size:11px;letter-spacing:2px;color:var(--txt);text-transform:uppercase;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--b1);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.35;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.slbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:5px;}
.sval{font-family:var(--mono);font-size:14px;color:var(--txt);}
.sval.big{font-size:26px;}
.sval.cy{color:var(--cy);text-shadow:var(--cyg);}
.sval.gold{color:var(--gold);}
.sval.pos{color:var(--pos);}.sval.neg{color:var(--neg);}
.scur{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:4px;}

/* SECTION HEADER */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.st{font-family:var(--ui);font-size:9px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;white-space:nowrap;}
.sl{flex:1;height:1px;background:linear-gradient(90deg,var(--b1),transparent);}

/* CHART */
.chw{background:var(--card);border:1px solid var(--b1);border-radius:14px;padding:14px;margin-top:10px;}
.chl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:14px;}

/* TABLE */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--b1);}
.tbl{border-collapse:collapse;min-width:max-content;width:100%;}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;padding:10px 12px;text-align:right;background:var(--card2);border-bottom:1px solid var(--b1);white-space:nowrap;}
.tbl th:first-child,.tbl th:nth-child(2){text-align:left;}
.tbl td{font-family:var(--mono);font-size:11px;color:var(--txt);padding:8px 12px;border-bottom:1px solid rgba(22,40,64,.5);text-align:right;white-space:nowrap;background:var(--card);}
.tbl td:first-child,.tbl td:nth-child(2){text-align:left;}
.tbl tr:hover td{background:rgba(0,212,255,.04);}
.tbl tfoot td{background:var(--card2);border-top:1px solid var(--b1);border-bottom:none;}
.td\xEDa{color:var(--cy);font-size:9px;letter-spacing:1px;}.tnoche{color:var(--warn);font-size:9px;letter-spacing:1px;}
.qp{color:var(--pos);}.qn{color:var(--neg);}.fc{color:var(--cy);}.fn{color:var(--neg);}.eb{color:var(--warn);}

/* RECORD ITEM */
.rec{background:var(--card);border:1px solid var(--b1);border-radius:14px;padding:12px;margin-bottom:8px;transition:border-color .2s;}
.rec:hover{border-color:var(--b2);}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.rdate{font-family:var(--mono);font-size:10px;color:var(--cy);letter-spacing:2px;}
.rtag{font-family:var(--mono);font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:4px;border:1px solid;}
.rtag.d{color:var(--cy);border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.08);}
.rtag.n{color:var(--warn);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.08);}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.rf{text-align:center;}
.rl{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--dim);margin-bottom:2px;}
.rv{font-family:var(--mono);font-size:11px;color:var(--txt);}
.rv.p{color:var(--pos);}.rv.n{color:var(--neg);}.rv.c{color:var(--cy);}.rv.w{color:var(--warn);}
.ract{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--b1);}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--b1);background:var(--surf);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.2s;}
.ib.e:hover{border-color:var(--cy);color:var(--cy);}.ib.d:hover{border-color:var(--neg);color:var(--neg);}

/* FORM */
.flbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
.fin{width:100%;background:var(--surf);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;color:var(--txt);font-family:var(--mono);font-size:16px;outline:none;transition:.2s;margin-bottom:14px;}
.fin:focus{border-color:var(--cy);background:var(--cyd);}
.fin::placeholder{color:var(--dim);}.fin.nm{margin-bottom:0;}
.tsel{display:flex;gap:8px;margin-bottom:14px;}
.topt{flex:1;padding:10px;border-radius:10px;border:1px solid var(--b1);background:var(--surf);color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:1px;cursor:pointer;transition:.2s;text-align:center;}
.topt.d.on{border-color:var(--cy);color:var(--cy);background:var(--cyd);}
.topt.n.on{border-color:var(--warn);color:var(--warn);background:rgba(255,176,32,.1);}
.prev{background:var(--surf);border:1px solid var(--b1);border-radius:12px;padding:14px;margin:4px 0 16px;}
.pr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b1);}
.pr:last-child{border-bottom:none;}
.pl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;}
.pv{font-family:var(--mono);font-size:13px;color:var(--txt);}
.pv.p{color:var(--pos);}.pv.n{color:var(--neg);}.pv.c{color:var(--cy);}

/* TIPO SELECTOR */
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.tipo-card{border:2px solid var(--b1);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;background:var(--surf);text-align:center;}
.tipo-card:hover{border-color:var(--b2);}
.tipo-card.banca.on{border-color:var(--cy);background:var(--cyd);}
.tipo-card.listero.on{border-color:var(--gold);background:var(--goldd);}
.tipo-ico{font-size:28px;margin-bottom:8px;}
.tipo-nm{font-family:var(--ui);font-size:11px;letter-spacing:2px;color:var(--txt);margin-bottom:6px;}
.tipo-card.banca.on .tipo-nm{color:var(--cy);}
.tipo-card.listero.on .tipo-nm{color:var(--gold);}
.tipo-desc{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;line-height:1.6;}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px;background:rgba(255,176,32,.06);border:1px solid rgba(255,176,32,.2);border-radius:10px;cursor:pointer;}
.toggle-box{width:36px;height:20px;border-radius:10px;border:1px solid var(--b1);background:var(--surf);position:relative;transition:.2s;flex-shrink:0;}
.toggle-box.on{background:var(--warn);border-color:var(--warn);}
.toggle-knob{width:14px;height:14px;border-radius:50%;background:var(--dim);position:absolute;top:2px;left:2px;transition:.2s;}
.toggle-box.on .toggle-knob{left:18px;background:white;}
.toggle-lbl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;line-height:1.5;}

/* BUTTONS */
.bmain{width:100%;padding:14px;background:linear-gradient(135deg,#007aaa 0%,#00d4ff 100%);border:none;border-radius:12px;color:#001428;font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s;box-shadow:0 4px 22px rgba(0,212,255,.25);}
.bmain:hover{transform:translateY(-1px);box-shadow:0 6px 32px rgba(0,212,255,.4);}
.bmain:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.bghost{width:100%;padding:11px;background:transparent;border:1px solid var(--b1);border-radius:12px;color:var(--dim);font-family:var(--ui);font-size:10px;letter-spacing:2px;cursor:pointer;transition:.2s;margin-top:8px;}
.bghost:hover{border-color:var(--txt);color:var(--txt);}

/* BOTTOM NAV \u2014 5 items */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(2,8,16,.96);backdrop-filter:blur(18px);border-top:1px solid var(--b1);display:flex;align-items:center;justify-content:space-around;padding:8px 4px;padding-bottom:max(12px,var(--sab));z-index:100;}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 6px;border-radius:10px;background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:7px;letter-spacing:1px;text-transform:uppercase;transition:.2s;min-width:0;}
.nbtn.on{color:var(--cy);}
.ni{font-size:18px;line-height:1.2;}
.fab{flex:0 0 48px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#007aaa,#00d4ff);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#001428;box-shadow:0 0 22px rgba(0,212,255,.45);transition:.2s;margin-top:-16px;}
.fab:hover{transform:scale(1.1);box-shadow:0 0 36px rgba(0,212,255,.65);}

/* NOTIFICATION */
.notif{position:fixed;top:calc(64px + var(--sat));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--cy);border-radius:10px;padding:10px 18px;font-family:var(--mono);font-size:11px;color:var(--cy);z-index:500;white-space:nowrap;box-shadow:var(--cyg);animation:nIn .3s ease;}
@keyframes nIn{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* MODAL */
.movl{position:fixed;inset:0;background:rgba(2,8,16,.9);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card2);border:1px solid var(--b1);border-radius:16px;padding:24px;width:100%;max-width:340px;max-height:90vh;overflow-y:auto;}
.mtit{font-family:var(--ui);font-size:12px;letter-spacing:3px;margin-bottom:10px;}
.mtit.w{color:var(--neg);}.mtit.c{color:var(--cy);}
.mbod{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:18px;}
.mbtns{display:flex;gap:10px;}
.bcan{flex:1;padding:11px;background:transparent;border:1px solid var(--b1);border-radius:8px;color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
.bdel{flex:1;padding:11px;background:var(--neg);border:none;border-radius:8px;color:#fff;font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:1px;}
.bconf{flex:1;padding:11px;background:var(--cy);border:none;border-radius:8px;color:#001428;font-family:var(--mono);font-size:12px;cursor:pointer;font-weight:700;}
.cpick{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;}
.csw{width:32px;height:32px;border-radius:50%;cursor:pointer;transition:.2s;border:2px solid transparent;}
.csw.on{border-color:white;transform:scale(1.18);}

/* IMPORT */
.idrop{border:2px dashed var(--b2);border-radius:12px;padding:24px 20px;text-align:center;cursor:pointer;transition:.2s;background:var(--surf);display:flex;flex-direction:column;align-items:center;gap:8px;}
.idrop:hover{border-color:var(--cy);}
.iico{font-size:28px;}.itxt{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:1px;}
.isub{font-family:var(--mono);font-size:9px;color:var(--b2);letter-spacing:1px;}
.iwarn{background:rgba(255,61,107,.08);border:1px solid rgba(255,61,107,.25);border-radius:10px;padding:12px;margin-bottom:14px;font-family:var(--mono);font-size:10px;color:var(--neg);letter-spacing:1px;line-height:1.8;}
.iprev{background:var(--surf);border:1px solid var(--b1);border-radius:10px;padding:12px;margin:10px 0;font-family:var(--mono);font-size:11px;letter-spacing:1px;}
.iprev.ok{color:var(--pos);}.iprev.err{color:var(--neg);}

/* SECURITY INFO */
.secinfo{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.12);border-radius:12px;padding:14px;margin-bottom:16px;}
.sirow{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start;}.sirow:last-child{margin-bottom:0;}
.sitxt{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;line-height:1.7;}
.wnote{font-family:var(--mono);font-size:9px;color:var(--warn);letter-spacing:1px;line-height:1.7;margin-top:-8px;margin-bottom:18px;}

/* ONBOARDING */
.onboard{position:fixed;inset:0;z-index:800;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.ob-logo{width:80px;height:80px;object-fit:cover;object-position:50% 32%;border-radius:50%;border:2px solid rgba(201,168,76,.4);margin-bottom:12px;}
.ob-title{font-family:var(--ui);font-size:18px;font-weight:700;color:var(--gold);letter-spacing:4px;margin-bottom:4px;}
.ob-sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:32px;}
.ob-question{font-family:var(--ui);font-size:10px;letter-spacing:3px;color:var(--txt);text-transform:uppercase;margin-bottom:16px;}

/* MISC */
.empty{text-align:center;padding:50px 20px;color:var(--dim);}
.eico{font-size:36px;margin-bottom:10px;}.etxt{font-family:var(--mono);font-size:11px;letter-spacing:1px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--b1);border-radius:2px;}
